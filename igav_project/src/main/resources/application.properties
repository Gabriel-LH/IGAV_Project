# Nombre de la aplicación
spring.application.name=igav_project

# Configuración de Base de Datos MySQL Enterprise Server
spring.datasource.url=jdbc:mysql://localhost:3306/igav_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate (MySQL Dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Swagger / OpenAPI Documentation UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Evitar fallo en serializacion de proxies Hibernate
spring.jackson.serialization.fail-on-empty-beans=false

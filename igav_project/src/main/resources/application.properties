# Nombre de la aplicación
spring.application.name=igav_project

# Conexión a PostgreSQL (Ajusta el usuario y contraseña si es necesario)
spring.datasource.url=jdbc:postgresql://localhost:5433/igav_project
spring.datasource.username=postgres
spring.datasource.password=76801048
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Swagger / OpenAPI Documentation UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Evitar fallo en serializacion de proxies Hibernate
spring.jackson.serialization.fail-on-empty-beans=false